# Maximum-strictness configuration. Every cop is run in "fail the build" mode.
# New code has no exclusions: fix the code. A cop that cannot apply to a file is configured narrowly
# below, with the reason. Inline RuboCop directives are forbidden (see
# Style/DisableCopsWithinSourceCodeDirective), and there is no todo file.
plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-sorbet
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  # rubocop-rails turns this on. Only lib/ loads ActiveSupport (through ActiveRecord); the Rakefile and the
  # scripts run without it, so cops must not suggest ActiveSupport's core extensions (exclude?, many?).
  ActiveSupportExtensionsEnabled: false
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - 'vendor/**/*'
    - 'coverage/**/*'
    - 'sorbet/**/*'
    - 'tmp/**/*'
    - 'doc/**/*'
    - '.yardoc/**/*'
    # Generated by `db scan` (ActiveRecord's schema dumper); CI fails when it differs from a fresh dump,
    # so it must stay byte-for-byte what the dumper writes.
    - 'db/schema.rb'

# The project has always used double-quoted strings.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# --- Optional (disabled-by-default) cops that make sense for this codebase ---
Layout/ClassStructure:
  Enabled: true
Layout/EmptyLineAfterMultilineCondition:
  Enabled: true
Layout/LineLength:
  Max: 120
Lint/NumberConversion:
  Enabled: true
Naming/InclusiveLanguage:
  Enabled: true
Performance/ChainArrayAllocation:
  Enabled: true
Lint/RedundantCopDisableDirective:
  Enabled: true
Sorbet/ForbidTUnsafe:
  Enabled: true
Sorbet/ForbidTUntyped:
  Enabled: true
Style/ConstantVisibility:
  Enabled: true
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true
# Style/DocumentationMethod is intentionally NOT enabled: it requires the comment to sit
# directly above `def`, but Sorbet's `sig { ... }` must sit between them. Documentation
# completeness is enforced instead by the YARD gate (`yard stats` must report 100%).
Style/InvertibleUnlessCondition:
  Enabled: true
Style/MethodCalledOnDoEndBlock:
  Enabled: true
Style/RequireOrder:
  Enabled: true
Style/Send:
  Enabled: true
Style/SingleLineBlockParams:
  Enabled: true
Style/Documentation:
  Enabled: true
# Style/StringHashKeys is intentionally NOT enabled: the hashes here are keyed by what arrives as strings
# (command-line words, ENV names, database.yml keys, table names).

# rubocop-rails is loaded for its ActiveRecord and migration cops. Rails/Output assumes a Rails application
# with a logger; this project is a command-line tool whose interface is its stdout (lib/), and the seed
# file reports what it inserted the same way.
Rails/Output:
  Exclude:
    - 'lib/**/*.rb'
    - 'db/seeds.rb'

# Rails/RakeEnvironment wants every task to depend on Rails' `:environment` task, which only exists in a
# Rails application; the Rakefile here runs the verification tools and has no such task.
Rails/RakeEnvironment:
  Enabled: false

# A migration's `change` spells out the schema it creates, one statement per column or index; splitting it
# into helpers would hide the schema. `db baseline` also generates such migrations (one is shown in the
# adoption guide).
Metrics/MethodLength:
  Exclude:
    - 'db/migrate/*.rb'
    - 'docs/ADOPTING-A-DATABASE.md'

# Reek (default configuration) rejects one-letter names such as `e`.
Naming/RescuedExceptionsVariableName:
  PreferredName: error

# --- Sorbet: strictest sigils that are reachable ---
# lib/ and bin/ are `typed: strict`.
Sorbet/StrictSigil:
  Enabled: true
  Include:
    - 'lib/**/*.rb'
    - 'bin/db'
Sorbet/EnforceSigilOrder:
  Enabled: true
Sorbet/EnforceSignatures:
  Enabled: true
  Include:
    - 'lib/**/*.rb'

Naming/FileName:
  Exclude:
    - '**/*.md'
Style/OneClassPerFile:
  Exclude:
    - '**/*.md'

# rubocop-md: README snippets are illustrative, not standalone programs.
Style/FrozenStringLiteralComment:
  Exclude:
    - '**/*.md'

# Sorbet signatures name every parameter, including the block, so anonymous block forwarding (`&`)
# cannot be used in typed code.
Naming/BlockForwarding:
  EnforcedStyle: explicit

# docs/DEMO.md quotes an excerpt of db/schema.rb exactly as ActiveRecord's schema dumper writes it (that
# file is excluded above for the same reason).
Style/NumericLiterals:
  Exclude:
    - 'docs/DEMO.md'
Style/WordArray:
  Exclude:
    - 'docs/DEMO.md'

# Expected command output is spelled out as a heredoc in the example that produces it; a heredoc counts as
# one line, like the data it is.
RSpec/ExampleLength:
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']

# The suite runs single-threaded. Each example runs in its own temporary working directory, so that no
# example, and no mutation under test, can write into the project (spec/spec_helper.rb).
ThreadSafety/DirChdir:
  Exclude:
    - 'spec/spec_helper.rb'
