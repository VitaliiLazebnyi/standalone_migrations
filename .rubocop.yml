---
# Maximum-strictness configuration: every cop of RuboCop and of every plugin that applies is enabled
# (EnabledByDefault), including the ones RuboCop ships disabled, and every offense fails the build.
# A cop that is switched off, or narrowed for some files, is listed below with the reason: either it
# contradicts another enabled cop or the type checker, or it cannot apply to this kind of project.
# Inline RuboCop directives are forbidden (Style/DisableCopsWithinSourceCodeDirective, and
# script/forbidden_suppressions.sh), and there is no todo file.
plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-sorbet
  - rubocop-thread_safety

AllCops:
  EnabledByDefault: true
  NewCops: enable
  # rubocop-rails turns this on. Only lib/ loads ActiveSupport (through ActiveRecord); the Rakefile and the
  # scripts run without it, so cops must not suggest ActiveSupport's core extensions (exclude?, many?).
  ActiveSupportExtensionsEnabled: false
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - vendor/**/*
    - coverage/**/*
    - sorbet/**/*
    - tmp/**/*
    - doc/**/*
    - .yardoc/**/*
    - .mutant/**/*
    # Generated by `db scan` (ActiveRecord's schema dumper); CI fails when it differs from a fresh dump,
    # so it must stay byte-for-byte what the dumper writes.
    - db/schema.rb

# The project has always used double-quoted strings.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Every module here defines its methods inside `class << self`, below one `extend T::Sig` and one `private`.
Style/ClassMethodsDefinitions:
  EnforcedStyle: self_class

Layout/LineLength:
  Max: 120

# Reek (default configuration) rejects one-letter names such as `e`.
Naming/RescuedExceptionsVariableName:
  PreferredName: error

# Sorbet signatures name every parameter, including the block, so anonymous block forwarding (`&`)
# cannot be used in typed code.
Naming/BlockForwarding:
  EnforcedStyle: explicit

# --- Cops that stay off, and why ---

# Contradicts Style/RedundantConstantBase: this cop wants every constant written as `::Name`, that one
# rejects the `::` prefix wherever it is redundant (all top-level code: bin/db, the Rakefile, the scripts,
# the specs). RuboCop documents the cop as meant for an `Only`/`Ignore` list of known-ambiguous names, and
# this code base has no ambiguous constant.
Lint/ConstantResolution:
  Enabled: false

# Every Ruby file carries the copyright notice of LICENSE.txt (MIT). Markdown code blocks are fragments of a
# program, not files, so they carry none.
Style/Copyright:
  AutocorrectNotice: '# Copyright (c) 2026 Vitalii Lazebnyi'
  Exclude:
    - '**/*.md'
  Notice: ^# Copyright \(c\) 2026 Vitalii Lazebnyi$

# Requires the comment directly above `def`, but Sorbet's `sig { ... }` must sit between the two. The
# documentation is enforced by the YARD gate instead (`rake yard`: 100% documented, no warnings).
Style/DocumentationMethod:
  Enabled: false

# The hashes here are keyed by what arrives as strings: command-line words (`db migrate`, VERSION=...),
# environment variable names, database.yml keys and table names. Symbol keys would mean converting
# untrusted input to symbols and back.
Style/StringHashKeys:
  Enabled: false

# Neither style can be enforced. `fetch` style reports every `[]` call, including Sorbet's generic types
# (`T::Hash[String, String]`), `ActiveRecord::Migration[8.1]`, `Dir[...]` and array slices; `brackets` style
# turns `fetch`, which raises on a missing key, into `[]`, which hides it.
Style/HashLookupMethod:
  Enabled: false

# Rails/RakeEnvironment wants every task to depend on Rails' `:environment` task, which only exists in a
# Rails application; the Rakefile here runs the verification tools and has no such task.
Rails/RakeEnvironment:
  Enabled: false

# Only accepts comments written inside create_table/add_column. Satisfying it means rewriting the applied
# migrations of db/migrate, after which every existing database would differ from db/schema.rb.
Rails/SchemaComment:
  Enabled: false

# Sorbet/ForbidSig and Sorbet/ForbidTSig forbid the signatures that Sorbet/EnforceSignatures requires
# (typed: strict needs a `sig` on every method).
Sorbet/ForbidSig:
  Enabled: false
Sorbet/ForbidTSig:
  Enabled: false
# Forbids the T.let that typed: strict requires on every constant and instance variable.
Sorbet/ForbidTLet:
  Enabled: false
# Only valid when T::Sig is mixed into every Module (a global monkey patch of Module); this code extends
# T::Sig in each module that declares signatures instead.
Sorbet/RedundantExtendTSig:
  Enabled: false
# `typed: strong` forbids every call on T.untyped. The RBIs that Tapioca generates for ActiveRecord, and
# Psych.safe_load, return T.untyped for the APIs this tool is built on (migration_context, schema_migration,
# connection_pool, ...), so strong cannot be reached without shims that assert types Sorbet cannot check.
Sorbet/StrongSigil:
  Enabled: false

# --- Cops narrowed for some files, and why ---

# rubocop-rails is loaded for its ActiveRecord and migration cops. Rails/Output assumes a Rails application
# with a logger; this project is a command-line tool whose interface is its stdout (lib/), and the seed
# file and the scripts report what they did the same way.
Rails/Output:
  Exclude:
    - lib/**/*.rb
    - db/seeds.rb
    - script/*.rb
    - Rakefile

# The tool is configured through environment variables (AR_ENV, AR_MIGRATIONS_DIR, VERBOSE, ...), read
# when it boots; reading them is its interface. Writing to ENV stays forbidden.
Rails/EnvironmentVariableAccess:
  AllowReads: true

# A migration's `change` spells out the schema it creates, one statement per column or index; splitting it
# into helpers would hide the schema. `db baseline` also generates such migrations (one is shown in the
# adoption guide).
Metrics/MethodLength:
  Exclude:
    - db/migrate/*.rb
    - docs/ADOPTING-A-DATABASE.md

# ActiveRecord versions migrations through their superclass, `ActiveRecord::Migration[8.1]`. rubocop-sorbet
# already excludes db/migrate for this reason; the adoption guide shows such a migration too.
Sorbet/ForbidSuperclassConstLiteral:
  Exclude:
    - db/migrate/*.rb
    - docs/ADOPTING-A-DATABASE.md

# --- Sorbet: the strictest sigil every file can reach ---
# Everything is `typed: strict` except the RSpec example files and spec_helper.rb: RSpec runs each
# `describe`/`it` block and each `RSpec.configure` hook with instance_exec on an example group, which Sorbet
# cannot follow without a T.bind in every block, so they are `typed: false` (Sorbet still checks their
# syntax and constants).
Sorbet/StrictSigil:
  Exclude:
    - spec/**/*_spec.rb
    - spec/spec_helper.rb
    - '**/*.md'
Sorbet/TrueSigil:
  Exclude:
    - spec/**/*_spec.rb
    - spec/spec_helper.rb
    - '**/*.md'
Sorbet/EnforceSignatures:
  Exclude:
    - spec/**/*_spec.rb
    - spec/spec_helper.rb
    - '**/*.md'
Sorbet/HasSigil:
  Exclude:
    - '**/*.md'
Sorbet/ValidSigil:
  Exclude:
    - '**/*.md'

Naming/FileName:
  Exclude:
    - '**/*.md'
Style/OneClassPerFile:
  Exclude:
    - '**/*.md'

# rubocop-md: README snippets are illustrative, not standalone programs.
Style/FrozenStringLiteralComment:
  Exclude:
    - '**/*.md'

# docs/DEMO.md quotes an excerpt of db/schema.rb exactly as ActiveRecord's schema dumper writes it (that
# file is excluded above for the same reason), and the adoption guide the migration that `db baseline`
# generates from such a dump.
Style/MethodCallWithArgsParentheses:
  Exclude:
    - docs/ADOPTING-A-DATABASE.md
    - docs/DEMO.md
Style/NumericLiterals:
  Exclude:
    - docs/DEMO.md
Style/WordArray:
  Exclude:
    - docs/DEMO.md

# Expected command output is spelled out as a heredoc in the example that produces it; a heredoc counts as
# one line, like the data it is.
RSpec/ExampleLength:
  CountAsOne: [array, hash, heredoc, method_call]

# The suite runs single-threaded. config/database.yml reads the database name from DATABASE_NAME, and each
# test process (mutant forks one per mutation) creates a database of its own and points DATABASE_NAME at it
# for the bin/db processes it starts.
ThreadSafety/EnvMutation:
  Exclude:
    - spec/support/test_database.rb

# The suite runs single-threaded. Each example runs in its own temporary working directory, so that no
# example, and no mutation under test, can write into the project (spec/spec_helper.rb).
ThreadSafety/DirChdir:
  Exclude:
    - spec/spec_helper.rb
