---
# yamllint configuration. Every rule is on, and `yamllint --strict` turns every warning into a failure.
# key-ordering is the one rule left off: it would sort the keys of every mapping alphabetically, which
# puts a workflow's `jobs` before its `name` and `on`, and a step's `env` and `run` before its `name`. The
# order of these files is the conventional, reading order; sorting it catches no defect.
extends: default

rules:
  anchors: enable
  float-values:
    forbid-inf: true
    forbid-nan: true
    forbid-scientific-notation: true
    require-numeral-before-decimal: true
  key-ordering: disable
  line-length:
    max: 120
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  quoted-strings:
    quote-type: any
    required: only-when-needed
ignore-from-file: .gitignore
