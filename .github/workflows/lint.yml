---
name: Repository lint

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job installs one pinned tool (a release archive verified against its SHA-256, or a hashed Python
# package) and runs the check of the same name through script/check, exactly as it runs locally.
jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >-
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # actionlint runs ShellCheck (with .shellcheckrc: every optional check) on every `run:` script, so the
      # pinned ShellCheck is installed first.
      - name: Install actionlint and ShellCheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          actionlint="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${actionlint}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${actionlint}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${actionlint}" -C "${RUNNER_TEMP}/bin" actionlint
          shellcheck="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${shellcheck}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${shellcheck}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${shellcheck}" | sha256sum --check --strict
          tar -xJf "${RUNNER_TEMP}/${shellcheck}" -C "${RUNNER_TEMP}/bin" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - run: script/check actionlint

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >-
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - run: script/check shellcheck

  shfmt:
    name: shfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >-
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install shfmt
        env:
          SHFMT_VERSION: 3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  ${RUNNER_TEMP}/bin/shfmt" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/bin/shfmt"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - run: script/check shfmt

  yamllint:
    name: yamllint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >-
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Every package is pinned to a version and to its published hashes (.github/requirements/yamllint.txt).
      - name: Install yamllint
        run: |
          python3 -m venv "${RUNNER_TEMP}/yamllint"
          "${RUNNER_TEMP}/yamllint/bin/pip" install --disable-pip-version-check --quiet --require-hashes \
            --only-binary :all: --requirement .github/requirements/yamllint.txt
          echo "${RUNNER_TEMP}/yamllint/bin" >> "${GITHUB_PATH}"
      - run: script/check yamllint

  editorconfig:
    name: editorconfig-checker
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >-
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install editorconfig-checker
        env:
          EDITORCONFIG_CHECKER_VERSION: 4.0.2
          EDITORCONFIG_CHECKER_SHA256: 44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          archive="editorconfig-checker-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EDITORCONFIG_CHECKER_VERSION}/${archive}"
          echo "${EDITORCONFIG_CHECKER_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" editorconfig-checker
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - run: script/check editorconfig

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # zizmor-action installs zizmor from PyPI into a virtual environment.
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Every audit, at the pedantic persona; any finding fails the job.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          advanced-security: false
          persona: pedantic

  hadolint:
    name: hadolint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # hadolint runs from its official image, so containers stay available to the runner.
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            auth.docker.io:443
            github.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The official image, pinned by digest. Every rule applies, and any finding (down to "style") fails.
      - name: hadolint
        run: >-
          docker run --rm -i
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint --failure-threshold style - < Dockerfile

  checkmake:
    name: checkmake
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >-
            github.com:443
            proxy.golang.org:443
            storage.googleapis.com:443
            sum.golang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # `go install` verifies the module against the Go checksum database.
      - name: Install checkmake
        env:
          CHECKMAKE_VERSION: 0.3.2
        run: |
          go install "github.com/checkmake/checkmake/cmd/checkmake@v${CHECKMAKE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: script/check checkmake

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >-
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Configured in .markdownlint-cli2.yaml: every rule is on.
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
        with:
          globs: '**/*.md'

  typos:
    name: typos
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85  # v1.52.0

  warning-gate:
    name: Lint warning gate
    if: ${{ !cancelled() }}
    needs: [actionlint, shellcheck, shfmt, yamllint, editorconfig, zizmor, hadolint, checkmake, markdownlint, typos]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on any warning or deprecation in the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB_NAME: Lint warning gate
        run: script/warning_gate.sh
