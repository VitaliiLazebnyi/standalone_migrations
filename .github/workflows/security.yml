---
name: Security

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: 17 4 * * 1
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBYOPT: -w -W:deprecated -W:performance

jobs:
  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    # bundler-audit redefines Thor's say_error, which warns under -w (bundler/audit/cli/thor_ext, upstream).
    env:
      RUBYOPT: -W:deprecated -W:performance
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb,
        # upstream); only the gem install drops those, the repository's commands keep them.
        env:
          RUBYOPT: -W:deprecated
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - run: bundle exec rake audit

  # Requires the repository's Dependency graph to be enabled (Settings > Code security).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # post the dependency review summary on the pull request
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Any known vulnerability, of any severity, in any dependency the pull request adds or changes:
          # runtime, development (the tooling) and those whose scope is unknown.
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: on-failure
          # OpenSSF Scorecard levels are enforced by the "OpenSSF Scorecard of dependencies" job below instead:
          # this action only knows one global warning level, for the dependencies a pull request adds, while
          # `rake scorecard` scores every dependency and allows exceptions one package at a time, each with
          # its reason (script/scorecard_allowlist.yml).
          show-openssf-scorecard: false

  scorecard:
    name: OpenSSF Scorecard of dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        env:
          RUBYOPT: -W:deprecated
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true
      - name: Check the Ruby version
        run: script/check_ruby.sh
      # Every gem of Gemfile.lock and every Action of the workflows, at or above Scorecard 3 unless allowed.
      - run: script/check scorecard

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The pinned release binary is run directly: the gitleaks action still runs on a deprecated Node.js
      # version and logs deprecation warnings. The archive is verified against its published SHA-256 first.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" gitleaks
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Scan the full history for secrets
        run: script/check gitleaks

  # The image users run: no HIGH or CRITICAL vulnerability in it, and no misconfiguration in the Dockerfile.
  trivy:
    name: Image scan (Trivy)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # The job builds an image, so containers stay available to the runner.
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            ghcr.io:443
            github.com:443
            index.rubygems.org:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" trivy
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - run: script/check trivy

  warning-gate:
    name: Security warning gate
    if: ${{ !cancelled() }}
    needs: [bundler-audit, dependency-review, scorecard, gitleaks, trivy]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on any warning or deprecation in the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB_NAME: Security warning gate
        run: script/warning_gate.sh
