---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing is writable by default; every job re-declares the (read-only) permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every Ruby command runs with verbose warnings and the deprecation and performance categories, except where
# a job says otherwise: a third-party tool that warns under -w gets -W:deprecated -W:performance only.
env:
  RUBYOPT: -w -W:deprecated -W:performance

jobs:
  test:
    name: RSpec (PostgreSQL 18)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: app_development
          # Explicit authentication methods: initdb warns when it has to default them to "trust".
          POSTGRES_INITDB_ARGS: --auth-local=trust --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_development"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: app
      DATABASE_PASSWORD: secret
    steps:
      # Every outbound connection not listed is blocked. The job runs a service container, so containers
      # stay available to the runner.
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb,
        # upstream); only the gem install drops those, the repository's commands keep them.
        env:
          RUBYOPT: -W:deprecated
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true
      - name: Check the Ruby version
        run: script/check_ruby.sh
      # SimpleCov enforces minimum_coverage 100 (line + branch) and fails the run below it.
      - name: RSpec with the 100% line + branch coverage gate
        run: bundle exec rake spec

  lint:
    name: RuboCop and inline suppressions
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    # kramdown (loaded by rubocop-md) warns under -w (kramdown/parser/base.rb, upstream).
    env:
      RUBYOPT: -W:deprecated -W:performance
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        env:
          RUBYOPT: -W:deprecated
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - run: bundle exec rake rubocop suppressions

  typecheck:
    name: Sorbet
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Tapioca redefines Kernel#exit and #abort, which warns under -w (tapioca/runtime/helpers.rb, upstream).
    env:
      RUBYOPT: -W:deprecated -W:performance
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        env:
          RUBYOPT: -W:deprecated
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - run: bundle exec rake typecheck

  docs:
    name: YARD (100% documented)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    # YARD and kramdown warn under -w (yard/cli/yardoc.rb, kramdown/parser/base.rb, upstream).
    env:
      RUBYOPT: -W:deprecated -W:performance
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        env:
          RUBYOPT: -W:deprecated
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - run: bundle exec rake yard

  smells:
    name: Reek, Flay and Flog
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        env:
          RUBYOPT: -W:deprecated
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - run: bundle exec rake reek flay flog

  # Every dependency must be at its newest release, except those on the documented hold list
  # (script/outdated_holds.yml), which quotes the upstream constraint that blocks each one.
  outdated:
    name: Outdated dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            cache.ruby-lang.org:443
            github.com:443
            hub.docker.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        env:
          RUBYOPT: -W:deprecated
        with:
          ruby-version: .ruby-version
          rubygems: latest
          bundler-cache: true
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - run: script/check outdated

  # The project as a user runs it: the Docker image and docker compose (script/end_to_end.sh).
  end-to-end:
    name: Docker end-to-end
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The job builds and runs containers, so containers stay available to the runner.
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            github.com:443
            index.rubygems.org:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            rubygems.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: script/check end-to-end

  warning-gate:
    name: CI warning gate
    if: ${{ !cancelled() }}
    needs: [test, lint, typecheck, docs, smells, outdated, end-to-end]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on any warning or deprecation in the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB_NAME: CI warning gate
        run: script/warning_gate.sh
